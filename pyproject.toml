[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-sentiment"
version = "0.1.0"
description = "Event study: does the tone of earnings press releases predict post-earnings returns? FinBERT vs Loughran-McDonald."
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
